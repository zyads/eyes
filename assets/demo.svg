<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- transparent page background; every card paints its own background so this
       reads on both GitHub light and dark themes -->

  <!-- ================= terminal card ================= -->
  <g>
    <rect x="24" y="48" width="452" height="264" rx="12" fill="#16161e" stroke="#3b3d52" stroke-width="1"/>
    <!-- title bar -->
    <rect x="24" y="48" width="452" height="30" rx="12" fill="#1f2029"/>
    <rect x="24" y="66" width="452" height="12" fill="#1f2029"/>
    <circle cx="44" cy="63" r="5" fill="#f7768e"/>
    <circle cx="62" cy="63" r="5" fill="#e0af68"/>
    <circle cx="80" cy="63" r="5" fill="#9ece6a"/>
    <text x="250" y="67" font-size="12" fill="#565f89" text-anchor="middle">eyes</text>

    <!-- line 1: $ eyes wait -->
    <text x="44" y="112" font-size="14"><tspan fill="#565f89">$ </tspan><tspan fill="#9ece6a">eyes wait</tspan></text>
    <!-- blinking cursor (gated by the 8s loop, blinks at 1s inside it) -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.43;0.97;1" dur="8s" repeatCount="indefinite"/>
      <rect x="130" y="100" width="8" height="15" fill="#c0caf5">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- line 2: printed path -->
    <text x="44" y="142" font-size="14" fill="#7dcfff" opacity="0">
      ~/.local/state/eyes/latest.jpg
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.425;0.445;0.965;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- line 3: agent reads the frame -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.55;0.965;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="50" cy="173" r="5" fill="#d97757"/>
      <text x="64" y="178" font-size="14" fill="#c0caf5">A mug on the desk, still steaming.</text>
    </g>

    <!-- caption -->
    <text x="250" y="334" font-size="11" fill="#8b8d98" text-anchor="middle">any agent that can read a file</text>
  </g>

  <!-- ================= connector ================= -->
  <line x1="482" y1="180" x2="546" y2="180" stroke="#8b8d98" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="594" y1="180" x2="658" y2="180" stroke="#8b8d98" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- padlock -->
  <g stroke="#8b8d98" fill="none" stroke-width="2">
    <path d="M563 176 v-5 a7 7 0 0 1 14 0 v5"/>
    <rect x="558" y="176" width="24" height="17" rx="3" fill="#8b8d98" stroke="none"/>
  </g>
  <text x="570" y="212" font-size="11" fill="#8b8d98" text-anchor="middle">LAN-only or E2E-encrypted</text>

  <!-- travelling frame-dot -->
  <circle cy="180" r="6" fill="#7dcfff" opacity="0">
    <animate attributeName="cx" values="660;660;478;478" keyTimes="0;0.25;0.40;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.265;0.385;0.40;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cy="180" r="11" fill="none" stroke="#7dcfff" stroke-width="1.5" opacity="0">
    <animate attributeName="cx" values="660;660;478;478" keyTimes="0;0.26;0.41;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.5;0.5;0;0" keyTimes="0;0.26;0.275;0.395;0.41;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= phone card ================= -->
  <g>
    <rect x="664" y="40" width="152" height="280" rx="20" fill="#111118" stroke="#3b3d52" stroke-width="1"/>
    <!-- notch -->
    <rect x="712" y="50" width="56" height="8" rx="4" fill="#2a2b38"/>

    <!-- viewfinder -->
    <rect x="678" y="70" width="124" height="176" rx="6" fill="#0a0a12"/>
    <!-- scene: mug on a desk -->
    <line x1="686" y1="216" x2="794" y2="216" stroke="#2f3142" stroke-width="2"/>
    <rect x="716" y="176" width="40" height="40" rx="4" fill="#414868"/>
    <path d="M756 184 h8 a8 8 0 0 1 0 20 h-8" fill="none" stroke="#414868" stroke-width="5"/>
    <!-- steam -->
    <g stroke="#565f89" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M728 168 q4 -6 0 -12 q-4 -6 0 -12">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M744 168 q-4 -6 0 -12 q4 -6 0 -12">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- viewfinder corner brackets -->
    <g stroke="#565f89" stroke-width="2" fill="none">
      <path d="M686 88 v-8 h8"/>
      <path d="M794 80 h-8 M794 80 v8" stroke-linecap="square"/>
      <path d="M686 228 v8 h8"/>
      <path d="M794 236 h-8 M794 236 v-8" stroke-linecap="square"/>
    </g>

    <!-- SNAP flash -->
    <rect x="678" y="70" width="124" height="176" rx="6" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.22;0.235;0.27;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="740" y="164" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold" opacity="0">
      SNAP
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.215;0.225;0.30;0.325;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- shutter button -->
    <circle cx="740" cy="282" r="18" fill="none" stroke="#565f89" stroke-width="2"/>
    <circle cx="740" cy="282" r="13" fill="#c0caf5">
      <animate attributeName="r" values="13;13;10;13;13" keyTimes="0;0.205;0.22;0.24;1" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- caption -->
    <text x="740" y="340" font-size="11" fill="#8b8d98" text-anchor="middle">your phone, no app</text>
  </g>
</svg>
